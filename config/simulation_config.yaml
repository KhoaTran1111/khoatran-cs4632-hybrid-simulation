simulation:
  grid_width: 50
  grid_height: 30
  max_steps: 2000
  time_step: 1.0
  random_seed: 42

agents:
  num_robots: 10
  num_pedestrians: 30
  robot_speed: 1.0
  pedestrian_speed: 1.2

emergency:
  trigger_step: 800          # changeable
  safe_zones:                # corners as safe retreat points
    - [0, 0]
    - [0, 29]
    - [49, 0]
    - [49, 29]

warehouse:
  shelves:                   # simple obstacles
    - [10, 5, 15, 10]        # x1,y1,x2,y2 rectangles
    - [20, 15, 25, 20]
  exits:
    - [25, 0]                # pedestrian exits

orders:
  arrival_rate: 0.05         # lambda for Poisson arrivals per step
  q_policy: 20               # (Q,r) reorder point & quantity
  r_policy: 5

metrics:
  log_interval: 10           # steps between time-series logs
  output_dir: "results/"